interface:
  display_name: "Implement"
  short_description: "Implement with runtime proof and a completed review"
  default_prompt: "Use $implement to load this spec folder as one handoff bundle, then implement one outcome at a time. Read its textual contracts and inspect approved reference artifacts before changing source; map each acceptance criterion to automated tests through $tdd, evals through $llm-evals for LLM output that varies run to run, runtime evidence, or a combination, and reconcile each applicable acceptance and reference criterion with runtime evidence, including actual-screen comparison under each claimed platform's intended layout and native conventions when an approved visual reference exists. Once the criteria pass, probe next to each changed behavior in the running product, record each probe with what it showed, and triage what probes find like review findings before the review. Give the same handoff to one whole-diff automated review, keep completion pending for uninspected or uncompared requirements or a blocked review unless explicitly waived, triage without automatic re-review, repeat runtime proof after executable repairs, report every criterion with its checks and evidence, and provide a runnable handoff when available."
