interface:
  display_name: "Implement"
  short_description: "Implement with runtime proof and a completed review"
  default_prompt: "Use $implement to implement this spec folder one outcome at a time, actively prove changed behavior with a matching runtime skill or the strongest usable runtime path, reconcile observed behavior with the product contract and active unfinished tasks, and re-verify the changed flow and PRODUCT.md core loop on every claimed platform. Complete one automated review of the whole diff using applicable user authorization, recover execution failures without counting them as a pass, keep completion pending when review is blocked unless the user explicitly waives it, triage the result without automatic re-review, repeat the runtime gate after any executable repair, and give a runnable handoff when available."
